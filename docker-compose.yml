services:
  postgres:
    image: postgres:15-alpine
    container_name: jobdog-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: jobdog
      POSTGRES_USER: jobdog
      POSTGRES_PASSWORD: jobdog
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - jobdog-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobdog"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: jobdog-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - jobdog-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend-api:
    build:
      context: ./services/backend-api
      dockerfile: Dockerfile
    container_name: jobdog-backend-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/jobdog
      SPRING_DATASOURCE_USERNAME: jobdog
      SPRING_DATASOURCE_PASSWORD: jobdog
      APP_JWT_SECRET: ${APP_JWT_SECRET}
      APP_JWT_EXPIRATION: ${APP_JWT_EXPIRATION:-P7D}
      APP_R2_ENDPOINT: ${APP_R2_ENDPOINT}
      APP_R2_BUCKET: ${APP_R2_BUCKET:-resumes}
      APP_R2_ACCESS_KEY: ${APP_R2_ACCESS_KEY}
      APP_R2_SECRET_KEY: ${APP_R2_SECRET_KEY}
      APP_R2_REGION: ${APP_R2_REGION:-auto}
      APP_OPENAI_API_KEY: ${APP_OPENAI_API_KEY}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      APP_OAUTH_REDIRECT_BASE: ${APP_OAUTH_REDIRECT_BASE:-http://localhost:8080}
      APP_FRONTEND_BASE_URL: ${APP_FRONTEND_BASE_URL:-http://localhost:3000}
      APP_CORS_ALLOWED_ORIGIN_PROD: ${APP_CORS_ALLOWED_ORIGIN_PROD:-https://jobdog.dev}
      APP_CORS_ALLOWED_ORIGIN_WWW: ${APP_CORS_ALLOWED_ORIGIN_WWW:-https://www.jobdog.dev}
      APP_CORS_ALLOWED_ORIGIN_VERCEL: ${APP_CORS_ALLOWED_ORIGIN_VERCEL:-}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "8080:8080"
    networks:
      - jobdog-network

  scraper-worker:
    build:
      context: ./services/scraper-worker
      dockerfile: Dockerfile
    container_name: jobdog-scraper-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://jobdog:jobdog@postgres:5432/jobdog?sslmode=disable
      DATABASE_USERNAME: jobdog
      DATABASE_PASSWORD: jobdog
      OPENAI_API_KEY: ${APP_OPENAI_API_KEY}
      # Unset by default: scrapers upsert directly, exactly as before. Set this
      # (and start the redpanda service) to switch to the streaming path — see
      # docs/kafka.md. Local/dev opt-in only; nothing here touches production
      # until this var is actually set wherever this compose file is deployed.
      KAFKA_BROKERS: ${KAFKA_BROKERS:-}
    networks:
      - jobdog-network

  # Kafka-wire-compatible broker for the streaming ingestion pipeline (see
  # docs/kafka.md). Off the critical path by default: nothing depends on it,
  # and the scraper/classifier only touch it when KAFKA_BROKERS is set. Runs
  # in dev-container mode (single node, auto-created topics, no persistent
  # volume) — fine for local experimentation, not how you'd run this for real.
  #
  # profiles: streaming — a bare `docker compose up -d` (what the deploy
  # workflow runs) never starts this. Explicitly opt in with
  # `docker compose --profile streaming up -d`. Learned the hard way: without
  # this, a plain redeploy silently started Redpanda + classifier + MinIO +
  # s3sink on the production t4g.small (2GB RAM) box, which was never the
  # intent — this pipeline was meant to stay local/dev-only until a separate,
  # deliberate decision to run it for real.
  redpanda:
    image: redpandadata/redpanda:v24.2.7
    container_name: jobdog-redpanda
    restart: unless-stopped
    profiles: ["streaming"]
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=512M
      - --overprovisioned
      - --node-id=0
      - --check=false
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:9092
    ports:
      - "9092:9092"
    networks:
      - jobdog-network
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Consumes raw.postings, runs the same classification the synchronous
  # scrapers do, and persists — see docs/kafka.md. Only meaningful once
  # KAFKA_BROKERS is set and at least one scraper is publishing to it.
  classifier:
    build:
      context: ./services/scraper-worker
      dockerfile: Dockerfile
    container_name: jobdog-classifier
    restart: unless-stopped
    profiles: ["streaming"]
    entrypoint: ["/app/classifier"]
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://jobdog:jobdog@postgres:5432/jobdog?sslmode=disable
      DATABASE_USERNAME: jobdog
      DATABASE_PASSWORD: jobdog
      OPENAI_API_KEY: ${APP_OPENAI_API_KEY}
      KAFKA_BROKERS: redpanda:9092
    networks:
      - jobdog-network

  # Local S3-compatible store for testing the Databricks-side sink without
  # touching real AWS or the R2 bucket backend-api already pays for. Point
  # S3_ENDPOINT at this for local dev; point it at R2's endpoint (or omit it
  # for real AWS S3) to use either of those instead — see cmd/s3sink.
  minio:
    image: minio/minio:RELEASE.2024-08-03T04-33-23Z
    container_name: jobdog-minio
    restart: unless-stopped
    profiles: ["streaming"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: jobdog
      MINIO_ROOT_PASSWORD: jobdog-minio-local
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - jobdog-network
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Consumes enriched.postings and writes Parquet to S3 for Databricks/Spark
  # to read — see docs/kafka.md. Only meaningful once KAFKA_BROKERS and
  # S3_BUCKET are both set; disabled otherwise (cmd/s3sink refuses to start).
  s3sink:
    build:
      context: ./services/scraper-worker
      dockerfile: Dockerfile
    container_name: jobdog-s3sink
    restart: unless-stopped
    profiles: ["streaming"]
    entrypoint: ["/app/s3sink"]
    depends_on:
      redpanda:
        condition: service_healthy
    environment:
      KAFKA_BROKERS: redpanda:9092
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-jobdog}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-jobdog-minio-local}
      S3_REGION: ${S3_REGION:-auto}
    networks:
      - jobdog-network

networks:
  jobdog-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:
